name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [production, staging]

# Permissions obligatoires pour pousser vers ghcr.io depuis une organisation
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # Ne jamais annuler un déploiement en cours

jobs:
  deploy:
    name: Build · Push · Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      # ── Build & push image Docker ──────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Déploiement SSH sur le VPS ─────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="$HOME/regtech"
            IMAGE="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
            COMPOSE="docker compose -f $APP_DIR/docker/docker-compose.prod.yml --env-file $APP_DIR/.env.production"

            echo "==> Mise à jour du code source"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "    Premier déploiement — clonage du repo"
              git clone git@github.com:${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git pull origin main

            echo "==> Authentification GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Téléchargement de la nouvelle image"
            docker pull "$IMAGE"

            echo "==> Mise à jour du tag image dans .env"
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=sha-${{ github.sha }}|" "$APP_DIR/.env.production" || true

            echo "==> Migrations base de données"
            docker run --rm \
              --env-file "$APP_DIR/.env.production" \
              --network kyc_network_prod \
              "$IMAGE" sh -c "pnpm db:push"

            echo "==> Redémarrage de l'application"
            $COMPOSE up -d --no-deps app

            echo "==> Attente démarrage (30s)"
            sleep 30

            echo "==> Health check"
            curl -sf http://localhost:3000/health

            echo "==> Nettoyage images obsolètes"
            docker image prune -f

            echo "✅ Deploy terminé — $IMAGE"

      # ── Notification (optionnel) ───────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚨 Deployment failed on commit ${context.sha.slice(0,7)} — check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            }).catch(() => {})
