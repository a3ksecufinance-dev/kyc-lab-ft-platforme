name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [production, staging]

# Permissions obligatoires pour pousser vers ghcr.io depuis une organisation
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # Ne jamais annuler un déploiement en cours

jobs:
  deploy:
    name: Build · Push · Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      # ── Build & push image Docker ──────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Set up QEMU (cross-compilation ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Déploiement SSH sur le VPS ─────────────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="$HOME/regtech"
            IMAGE="ghcr.io/${{ github.repository }}:latest"
            COMPOSE="docker compose -p kyc-aml -f $APP_DIR/docker/docker-compose.prod.yml --env-file $APP_DIR/docker/.env.production"

            echo "==> Mise à jour du code source"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "    Premier déploiement — clonage du repo"
              rm -rf "$APP_DIR"
              git clone git@github.com:${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Authentification GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Téléchargement de la nouvelle image"
            docker pull "$IMAGE"

            echo "==> Démarrage postgres et redis (sans recréer si déjà sains)"
            $COMPOSE up -d --no-recreate postgres redis

            echo "==> Attente postgres healthy (30s)"
            sleep 30

            echo "==> Migration base de données"
            $COMPOSE run --rm migrate || {
              echo "--- LOGS MIGRATE ---"
              $COMPOSE logs migrate
              exit 1
            }

            echo "==> Build service ML (Python)"
            $COMPOSE build ml

            echo "==> Démarrage service ML"
            $COMPOSE up -d ml

            echo "==> Libération port 3000"
            docker rm -f kyc_app 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 3

            echo "==> Démarrage application"
            $COMPOSE up -d app

            echo "==> Attente démarrage (60s)"
            sleep 60

            echo "==> Health check"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
            echo "Health check status: $STATUS"
            curl -s http://localhost:3000/health | python3 -m json.tool || true
            if [ "$STATUS" = "000" ] || [ "$STATUS" = "503" ]; then
              echo "--- LOGS APP (50 dernières lignes) ---"
              docker logs kyc_app --tail 50
              if [ "$STATUS" = "000" ]; then
                echo "--- ERREUR FATALE : app ne répond pas ---"
                exit 1
              fi
            fi

            echo "==> Health check service ML"
            ML_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            echo "ML health: $ML_STATUS"
            if [ "$ML_STATUS" = "000" ]; then
              echo "WARN: Service ML ne répond pas encore (démarrage en cours)"
              docker logs kyc_ml --tail 20 || true
            fi

            echo "==> Nettoyage images obsolètes"
            docker image prune -f

            echo "✅ Deploy terminé — $IMAGE"

      # ── Notification (optionnel) ───────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚨 Deployment failed on commit ${context.sha.slice(0,7)} — check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            }).catch(() => {})
